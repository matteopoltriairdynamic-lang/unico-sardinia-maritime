<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><title>Prova iframe</title></head>
<body style="margin:0;background:#0b0c0f;font-family:system-ui">
<div style="height:120px;color:#8ea;padding:20px">finto contenuto sopra, blocco 90Nodi</div>

<iframe id="unico-frame" src="https://matteopoltriairdynamic-lang.github.io/unico-molo66/" title="UNICO" scrolling="no" loading="lazy" style="width:100%;border:0;display:block;height:520px"></iframe>
<script>
window.addEventListener('message', function (e) {
  if (e.data && e.data.unicoHeight) {
    document.getElementById('unico-frame').style.height = e.data.unicoHeight + 'px';
    document.title = 'altezza ' + e.data.unicoHeight;
  }
});
</script>

<div style="height:120px;color:#8ea;padding:20px">finto contenuto sotto, Inizia il viaggio con Molo66</div>
</body>
</html>
