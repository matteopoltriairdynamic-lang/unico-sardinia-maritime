===========================================================================
  SEZIONE UNICO  .  da inserire nella home di molo66.com
  ---------------------------------------------------------------------
  DOVE
  Subito dopo il blocco "La nuova era della nautica" (90Nodi)
  e prima del blocco "Inizia il viaggio con Molo66".

  COME
  Copiare tutto quello che sta fra i due marcatori
  INIZIO BLOCCO DA COPIARE  e  FINE BLOCCO DA COPIARE.
  Il CSS e' interamente circoscritto a #unico-molo66, non tocca nessuno
  stile del sito. Il logo e' un SVG vettoriale incorporato, nessun file
  esterno da caricare.

  COMPORTAMENTO
  Il modulo e' nascosto. Compare solo dopo il clic sul pulsante
  "Richiedi una presentazione privata". Senza javascript il modulo
  resta visibile, quindi funziona in ogni caso.

  IL MODULO
  Fondo, caratteri, colori, campi, etichette, opzioni e testi sono
  ricalcati sul modulo ufficiale di unico-luxury.com. Invia tramite
  Web3Forms, nessun server da predisporre. Va sostituita una sola cosa,
  il valore di name="access_key". Il campo nascosto "origine" marca ogni
  richiesta come proveniente da molo66.com.

  PRIVACY
  Nel testo sopra il pulsante c'e' un link href="#privacy".
  Va puntato all'informativa privacy di Molo66.
===========================================================================
-->

        </form>

      </div>
    </div>

  </div>
</section>

<script>
(function(){
  var f=document.getElementById('unico-form');
  if(!f) return;
  var s=document.getElementById('unico-status');
  var b=f.querySelector('button[type=submit]');
  var panel=document.getElementById('unico-panel');
  var trigger=document.getElementById('unico-trigger');
  var rule=document.querySelector('#unico-molo66 .u-rule');

  var wrap=document.getElementById('unico-wrap');
  var intro=document.getElementById('unico-intro');
  panel.hidden=true;
  trigger.hidden=false;
  trigger.addEventListener('click',function(){
    panel.hidden=false;
    intro.hidden=false;
    wrap.className='u-wrap is-open';
    trigger.hidden=true;
    trigger.setAttribute('aria-expanded','true');
    var first=f.querySelector('input[name=nome_cognome]');
    if(first){first.focus();}
    panel.scrollIntoView({behavior:'smooth',block:'nearest'});
  });

  f.addEventListener('submit',function(e){
    e.preventDefault();
    s.className='u-status';
    s.textContent='Invio in corso.';
    b.disabled=true;
    var d={};
    new FormData(f).forEach(function(v,k){d[k]=v});
    d.pagina=window.location.href;
    fetch('https://api.web3forms.com/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify(d)
    }).then(function(r){return r.json()}).then(function(j){
      if(j.success){
        s.className='u-status u-ok';
        s.textContent='Richiesta inviata. Verrai ricontattato personalmente e in forma riservata.';
        f.reset();
      }else{
        s.className='u-status u-err';
        s.textContent='Invio non riuscito. Scrivi a matteo.poltri@unico-luxury.com';
        b.disabled=false;
      }
    }).catch(function(){
      s.className='u-status u-err';
      s.textContent='Invio non riuscito. Scrivi a matteo.poltri@unico-luxury.com';
      b.disabled=false;
    });
  });
})();
</script>

<script>
(function(){
  function post(){
    try{parent.postMessage({unicoHeight:document.documentElement.scrollHeight},'*');}catch(e){}
  }
  if(window.ResizeObserver){new ResizeObserver(post).observe(document.documentElement);}
  window.addEventListener('load',post);
  window.addEventListener('resize',post);
  setTimeout(post,300);
  setTimeout(post,1200);
})();
</script>
